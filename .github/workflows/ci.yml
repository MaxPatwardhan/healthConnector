# Lint, type-check and test against the locked dependencies.
# The tests are fully mocked: no Intervals.icu credentials are needed or used.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: uv sync --locked --all-extras
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Mypy
        run: uv run mypy src tests
      - name: Pytest
        run: uv run pytest
